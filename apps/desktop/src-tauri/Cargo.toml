[package]
name = "agent-test"
version = "0.1.0"
description = "Agent Test desktop shell"
authors = ["agent-test"]
edition = "2021"

[lib]
name = "agent_test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
